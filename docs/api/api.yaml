openapi: 3.1.0
info:
  title: Tahiry API
  version: 1.0.0
  description: |
    API for managing personal categories and money movements.

    Authentication endpoints issue a JWT in the `sess_id` HTTP-only cookie.
    Protected entity endpoints authenticate the request inside the route
    handler by verifying that cookie and resolving the user's ID.
servers:
  - url: /

tags:
  - name: Auth
  - name: Balance
  - name: Categories
  - name: Money movements
  - name: Accounts
  - name: Email reminders

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      operationId: register
      description: Registers and authenticates a new user. A default account named `cash` is created for the user's profile as part of the registration transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and authenticated. A default `cash` account is also created for the new user.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/password-reset:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: requestPasswordReset
      description: Public endpoint. If the email belongs to a registered user, generates a random single-use token, stores only its hash in `password_reset_token` with a five-minute expiration, and emails a link to the confirmation endpoint. The response is the same whether or not the email is registered to prevent account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Password reset request accepted. This response is returned whether or not the email is registered.
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/password-change/confirm:
    get:
      tags: [Auth]
      summary: Validate a password reset token
      operationId: confirmPasswordChange
      description: Public endpoint. Validates that the token matches a stored hash, has not expired, and has not been used. A valid token is not consumed here so the password-change page can submit it with the new password.
      parameters:
        - name: token
          in: query
          required: true
          description: Single-use password reset token received by email.
          schema:
            type: string
      responses:
        '303':
          description: Redirects to `/password-change?token={token}` if valid, or to `/login?isPasswordResetFail=true` if the token is missing, invalid, expired, or already used.
          headers:
            Location:
              description: Password-change page URL with the token, or the login page with the failure flag.
              schema:
                type: string
                examples:
                  valid:
                    value: /password-change?token=opaque-reset-token
                  invalid:
                    value: /login?isPasswordResetFail=true

  /api/auth/password-reset/change:
    post:
      tags: [Auth]
      summary: Change a password using a reset token
      operationId: changePasswordWithResetToken
      description: Public endpoint. Validates an unused password reset token, hashes the new password, then atomically updates the user's password and marks the token as used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetChangeRequest'
      responses:
        '204':
          description: Password changed and reset token consumed.
        '400':
          description: The request is invalid, or the reset token is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/email-change:
    post:
      tags: [Auth]
      summary: Request an email address change
      operationId: requestEmailChange
      description: Verifies the current password, stores the requested email address with a hash of a single-use confirmation token and its expiration (10 minutes from issuance), and emails the token to the new address using Resend. The current email remains unchanged until confirmation succeeds.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: Email change request accepted and confirmation email sent to the new address.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication is missing or invalid, or the current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The requested email address is already registered.
          $ref: '#/components/responses/Conflict'

  /api/auth/email-change/confirm:
    get:
      tags: [Auth]
      summary: Confirm an email address change
      operationId: confirmEmailChange
      description: Public, single-use confirmation endpoint. Accepts the token emailed to the new address, verifies its hash and 10-minute expiration, updates the user's email, clears the pending email-change fields, and sends a notification to the old email address. If a matching token has expired, its pending email-change fields are cleared before the error response is returned.
      parameters:
        - name: token
          in: query
          required: true
          description: Single-use email change confirmation token.
          schema:
            type: string
      responses:
        '303':
          description: Redirects to the settings page. `emailChangeSuccess=true` indicates confirmation succeeded; `false` indicates an invalid, expired, or otherwise unsuccessful confirmation.
          headers:
            Location:
              description: Settings page URL with the `emailChangeSuccess` query parameter.
              schema:
                type: string

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      operationId: logout
      description: Public endpoint that removes the `sess_id` cookie from the client.
      responses:
        '204':
          description: The `sess_id` cookie was removed.
          headers:
            Set-Cookie:
              description: Deleted `sess_id` cookie.
              schema:
                type: string

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: getCurrentUser
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated user without the password hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Auth]
      summary: Update the authenticated user
      operationId: updateCurrentUser
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Authenticated user updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/accounts:
    get:
      tags: [Accounts]
      summary: List the current user's accounts
      operationId: listAccounts
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Accounts owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Accounts]
      summary: Create an account
      operationId: createAccount
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The current user already owns an account with the same name, compared case-insensitively.
          $ref: '#/components/responses/Conflict'

  /api/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Accounts]
      summary: Get one account
      operationId: getAccount
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Account owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Accounts]
      summary: Update an account
      operationId: updateAccount
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The current user already owns another account with the same name, compared case-insensitively.
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Accounts]
      summary: Delete an account
      operationId: deleteAccount
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Account deleted. Related movements retain their records with `id_account` and `id_account_source` set to null.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The account cannot be deleted because it is the user's only remaining account.
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/email-reminders:
    get:
      tags: [Email reminders]
      summary: Get the current user's email reminder
      operationId: getEmailReminder
      security:
        - SessionCookie: []
      responses:
        '200':
          description: The email reminder owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailReminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Email reminders]
      summary: Create the current user's email reminder
      operationId: createEmailReminder
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReminderInput'
      responses:
        '201':
          description: Email reminder created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailReminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The authenticated user already has an email reminder.
          $ref: '#/components/responses/Conflict'

    patch:
      tags: [Email reminders]
      summary: Update the current user's email reminder
      operationId: updateEmailReminder
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReminderPatch'
      responses:
        '200':
          description: Email reminder updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailReminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Email reminders]
      summary: Delete the current user's email reminder
      operationId: deleteEmailReminder
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Email reminder deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/transfer:
    post:
      tags: [Money movements]
      summary: Transfer money between two accounts
      operationId: transferMoney
      description: Creates a single `TRANSFERT` movement where `id_account` is the destination account and `id_account_source` is the source account. Both accounts must belong to the authenticated user and be distinct.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
      responses:
        '201':
          description: Transfer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
           description: Source or destination account does not exist or is not owned by the current user.
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/Error'
        '409':
          description: The source account does not have enough funds for the transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/exports:
    post:
      tags: [Money movements]
      summary: Export money movements to Excel
      operationId: exportMoneyMovements
      description: Exports all money movements owned by the authenticated user. If either date is omitted, that side of the date range is unbounded.
      security:
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportInput'
      responses:
        '200':
          description: Excel workbook containing the requested money movements.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="money-movements.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/balance:
    get:
      tags: [Balance]
      summary: Get the current user's lifetime balance
      operationId: getBalance
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lifetime income, expenses, and net balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories:
    get:
      tags: [Categories]
      summary: List the current user's categories
      operationId: listCategories
      security:
        - SessionCookie: []
      parameters:
        - name: cat_type
          in: query
          required: false
          description: Filter categories by type.
          schema:
            $ref: '#/components/schemas/CategoryType'
      responses:
        '200':
          description: Categories owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Categories]
      summary: Create a category
      operationId: createCategory
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Categories]
      summary: Get one category
      operationId: getCategory
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Category owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Categories]
      summary: Update a category
      operationId: updateCategory
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatch'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Category deleted. Related movements retain their records with a null category.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/money-movements:
    get:
      tags: [Money movements]
      summary: List the current user's money movements
      operationId: listMoneyMovements
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MovementType'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/LoggedForFrom'
        - $ref: '#/components/parameters/LoggedForTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated movements owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Money movements]
      summary: Create a money movement
      operationId: createMoneyMovement
      description: The `TRANSFERT` movement type is not accepted here; transfers are created through `POST /api/transfer`.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementInput'
      responses:
        '201':
          description: Money movement created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Referenced category or account does not belong to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/money-movements/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Money movements]
      summary: Get one money movement
      operationId: getMoneyMovement
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Money movement owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Money movements]
      summary: Update a money movement
      operationId: updateMoneyMovement
      description: The `TRANSFERT` movement type is not accepted here; transfers cannot be converted to or from other movement types. The movement's account is not changed by PATCH.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementPatch'
      responses:
        '200':
          description: Money movement updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Money movements]
      summary: Delete a money movement
      operationId: deleteMoneyMovement
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Money movement deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sess_id
      description: JWT session cookie containing the authenticated user's ID claim.

  headers:
    SessionCookie:
      description: JWT session cookie. The server should set HttpOnly, Secure, and an appropriate SameSite attribute.
      schema:
        type: string

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    MovementType:
      name: movement_type
      in: query
      schema:
        $ref: '#/components/schemas/MovementType'
    CategoryId:
      name: id_category
      in: query
      schema:
        type: string
        format: uuid
    AccountId:
      name: id_account
      in: query
      description: Filter movements linked to this account, either as destination (`id_account`) or as source (`id_account_source`), so transfers involving the account are included.
      schema:
        type: string
        format: uuid
    LoggedForFrom:
      name: logged_for_from
      in: query
      description: Include movements logged on or after this date.
      schema:
        type: string
        format: date
    LoggedForTo:
      name: logged_for_to
      in: query
      description: Include movements logged on or before this date.
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    User:
      type: object
      required: [id, username, email, currency]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        currency:
          type: string
          maxLength: 20
        created_at:
          type: [string, 'null']
          format: date-time

    RegisterRequest:
      type: object
      required: [username, email, password, currency]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        currency:
          type: string
          minLength: 1
          maxLength: 20

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    PasswordResetChangeRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Reset token received by email.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [newEmail, currentPassword]
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 255
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        currency:
          type: string
          minLength: 1
          maxLength: 20

    ExportInput:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date
          description: Inclusive start date. Omit for no lower bound.
        to:
          type: string
          format: date
          description: Inclusive end date. Omit for no upper bound.

    CategoryType:
      type: string
      enum: [EXPENSE, INCOME]

    CategoryInput:
      type: object
      required: [cat_name]
      properties:
        cat_type:
          $ref: '#/components/schemas/CategoryType'
        cat_name:
          type: string
          minLength: 1
          maxLength: 255

    CategoryPatch:
      type: object
      minProperties: 1
      properties:
        cat_type:
          $ref: '#/components/schemas/CategoryType'
        cat_name:
          type: string
          minLength: 1
          maxLength: 255

    Category:
      type: object
      required: [id, id_user, cat_type, cat_name]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        cat_type:
          $ref: '#/components/schemas/CategoryType'
        cat_name:
          type: string
          maxLength: 255

    MovementType:
      type: string
      enum: [EXPENSE, INCOME, TRANSFERT]
      description: TRANSFERT movements are only created through POST /api/transfer and rejected on direct creation and on PATCH.

    AccountInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    AccountPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    Account:
      type: object
      required: [id, id_user, name]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        created_at:
          type: [string, 'null']
          format: date-time

    EmailReminderInput:
      type: object
      required: [day_of_week, time]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of the week, where 0 is Sunday and 6 is Saturday.
        time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$'
          description: Reminder time in HH:mm or HH:mm:ss format.

    EmailReminderPatch:
      type: object
      minProperties: 1
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of the week, where 0 is Sunday and 6 is Saturday.
        time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$'
          description: Reminder time in HH:mm or HH:mm:ss format.

    EmailReminder:
      type: object
      required: [id, id_user, day_of_week, time]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of the week, where 0 is Sunday and 6 is Saturday.
        time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: Reminder time returned in HH:mm:ss format.

    TransferInput:
      type: object
      required: [id_account_source, id_account, amount]
      properties:
        id_account_source:
          type: string
          format: uuid
          description: Source account the money leaves. Stored in `id_account_source`.
        id_account:
          type: string
          format: uuid
          description: Destination account the money goes to. Stored in `id_account`.
        amount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Positive decimal amount with up to 10 total digits and 2 fractional digits.
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MovementInput:
      type: object
      required: [title, amount]
      properties:
        id_category:
          type: [string, 'null']
          format: uuid
        id_account:
          type: [string, 'null']
          format: uuid
          description: Assigns the movement to an account owned by the current user. Omitted or null leaves it unassigned. The account cannot be changed through PATCH.
        movement_type:
          $ref: '#/components/schemas/MovementType'
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        amount:
          type: string
          pattern: '^-?\d{1,8}(\.\d{1,2})?$'
          description: Decimal amount with up to 10 total digits and 2 fractional digits.
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MovementPatch:
      type: object
      minProperties: 1
      properties:
        id_category:
          type: [string, 'null']
          format: uuid
        movement_type:
          $ref: '#/components/schemas/MovementType'
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        amount:
          type: string
          pattern: '^-?\d{1,8}(\.\d{1,2})?$'
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MoneyMovement:
      type: object
      required: [id, id_user, movement_type, title, amount]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        id_category:
          type: [string, 'null']
          format: uuid
        movement_type:
          $ref: '#/components/schemas/MovementType'
        id_account:
          type: [string, 'null']
          format: uuid
          description: Destination account. Only set for TRANSFERT movements.
        id_account_source:
          type: [string, 'null']
          format: uuid
          description: Source account. Only set for TRANSFERT movements.
        title:
          type: string
          maxLength: 255
        description:
          type: [string, 'null']
        amount:
          type: string
          pattern: '^-?\d{1,8}(\.\d{1,2})?$'
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MovementPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MoneyMovement'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Balance:
      type: object
      required: [income, expense, balance, accounts]
      properties:
        income:
          type: string
          description: Lifetime income total with two fractional digits, excluding transfers.
        expense:
          type: string
          description: Lifetime expense total with two fractional digits, excluding transfers.
        balance:
          type: string
          description: Global lifetime income minus lifetime expenses with two fractional digits. Transfers have no effect on it.
        accounts:
          type: array
          description: Per-account balances for every account owned by the current user, including accounts without movements (reported as zeroed totals).
          items:
            $ref: '#/components/schemas/AccountBalance'

    AccountBalance:
      type: object
      required: [id_account, name, income, expense, balance]
      properties:
        id_account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        income:
          type: string
          description: Income logged on the account with two fractional digits.
        expense:
          type: string
          description: Expenses logged on the account with two fractional digits.
        balance:
          type: string
          description: Account balance with two fractional digits. Transfers count toward it — money entering (destination) is positive, money leaving (source) is negative.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource does not exist or is not owned by the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
