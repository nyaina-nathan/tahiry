openapi: 3.1.0
info:
  title: Pennywise API
  version: 1.0.0
  description: |
    API for managing personal categories and money movements.

    Authentication endpoints issue a JWT in the `sess_id` HTTP-only cookie.
    Protected entity endpoints are called through the application proxy. The
    proxy verifies the cookie and forwards the authenticated user's ID in the
    `X-User-Id` header.
servers:
  - url: /

tags:
  - name: Auth
  - name: Balance
  - name: Categories
  - name: Money movements
  - name: Accounts

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      operationId: logout
      description: Public endpoint that removes the `sess_id` cookie from the client.
      responses:
        '204':
          description: The `sess_id` cookie was removed.
          headers:
            Set-Cookie:
              description: Deleted `sess_id` cookie.
              schema:
                type: string

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: getCurrentUser
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated user without the password hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/accounts:
    get:
      tags: [Accounts]
      summary: List the current user's accounts
      operationId: listAccounts
      security:
        - ProxyUserId: []
      responses:
        '200':
          description: Accounts owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Accounts]
      summary: Create an account
      operationId: createAccount
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The current user already owns an account with the same name, compared case-insensitively.
          $ref: '#/components/responses/Conflict'

  /api/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Accounts]
      summary: Get one account
      operationId: getAccount
      security:
        - ProxyUserId: []
      responses:
        '200':
          description: Account owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Accounts]
      summary: Update an account
      operationId: updateAccount
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The current user already owns another account with the same name, compared case-insensitively.
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Accounts]
      summary: Delete an account
      operationId: deleteAccount
      security:
        - ProxyUserId: []
      responses:
        '204':
          description: Account deleted. Related movements retain their records with `id_account` and `id_account_source` set to null.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/transfer:
    post:
      tags: [Money movements]
      summary: Transfer money between two accounts
      operationId: transferMoney
      description: Creates a single `TRANSFERT` movement where `id_account` is the destination account and `id_account_source` is the source account. Both accounts must belong to the authenticated user and be distinct.
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
      responses:
        '201':
          description: Transfer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Source or destination account does not exist or is not owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/balance:
    get:
      tags: [Balance]
      summary: Get the current user's lifetime balance
      operationId: getBalance
      security:
        - ProxyUserId: []
      responses:
        '200':
          description: Lifetime income, expenses, and net balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories:
    get:
      tags: [Categories]
      summary: List the current user's categories
      operationId: listCategories
      security:
        - ProxyUserId: []
      parameters:
        - name: cat_type
          in: query
          required: false
          description: Filter categories by type.
          schema:
            $ref: '#/components/schemas/CategoryType'
      responses:
        '200':
          description: Categories owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Categories]
      summary: Create a category
      operationId: createCategory
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Categories]
      summary: Get one category
      operationId: getCategory
      security:
        - ProxyUserId: []
      responses:
        '200':
          description: Category owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Categories]
      summary: Update a category
      operationId: updateCategory
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatch'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      security:
        - ProxyUserId: []
      responses:
        '204':
          description: Category deleted. Related movements retain their records with a null category.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/money-movements:
    get:
      tags: [Money movements]
      summary: List the current user's money movements
      operationId: listMoneyMovements
      security:
        - ProxyUserId: []
      parameters:
        - $ref: '#/components/parameters/MovementType'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/LoggedForFrom'
        - $ref: '#/components/parameters/LoggedForTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated movements owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Money movements]
      summary: Create a money movement
      operationId: createMoneyMovement
      description: The `TRANSFERT` movement type is not accepted here; transfers are created through `POST /api/transfer`.
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementInput'
      responses:
        '201':
          description: Money movement created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Referenced category does not belong to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/money-movements/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Money movements]
      summary: Get one money movement
      operationId: getMoneyMovement
      security:
        - ProxyUserId: []
      responses:
        '200':
          description: Money movement owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Money movements]
      summary: Update a money movement
      operationId: updateMoneyMovement
      security:
        - ProxyUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementPatch'
      responses:
        '200':
          description: Money movement updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Money movements]
      summary: Delete a money movement
      operationId: deleteMoneyMovement
      security:
        - ProxyUserId: []
      responses:
        '204':
          description: Money movement deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sess_id
      description: JWT session cookie containing the authenticated user's ID claim.
    ProxyUserId:
      type: apiKey
      in: header
      name: X-User-Id
      description: Internal header set by the authenticated application proxy. Never trust a client-supplied value.

  headers:
    SessionCookie:
      description: JWT session cookie. The server should set HttpOnly, Secure, and an appropriate SameSite attribute.
      schema:
        type: string

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    MovementType:
      name: movement_type
      in: query
      schema:
        $ref: '#/components/schemas/MovementType'
    CategoryId:
      name: id_category
      in: query
      schema:
        type: string
        format: uuid
    AccountId:
      name: id_account
      in: query
      description: Filter movements linked to this account, either as destination (`id_account`) or as source (`id_account_source`), so transfers involving the account are included.
      schema:
        type: string
        format: uuid
    LoggedForFrom:
      name: logged_for_from
      in: query
      description: Include movements logged on or after this date.
      schema:
        type: string
        format: date
    LoggedForTo:
      name: logged_for_to
      in: query
      description: Include movements logged on or before this date.
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    User:
      type: object
      required: [id, username, email, currency]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        currency:
          type: string
          maxLength: 20
        created_at:
          type: [string, 'null']
          format: date-time

    RegisterRequest:
      type: object
      required: [username, email, password, currency]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        currency:
          type: string
          minLength: 1
          maxLength: 20

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    CategoryType:
      type: string
      enum: [EXPENSE, INCOME]

    CategoryInput:
      type: object
      required: [cat_name]
      properties:
        cat_type:
          $ref: '#/components/schemas/CategoryType'
        cat_name:
          type: string
          minLength: 1
          maxLength: 255

    CategoryPatch:
      type: object
      minProperties: 1
      properties:
        cat_type:
          $ref: '#/components/schemas/CategoryType'
        cat_name:
          type: string
          minLength: 1
          maxLength: 255

    Category:
      type: object
      required: [id, id_user, cat_type, cat_name]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        cat_type:
          $ref: '#/components/schemas/CategoryType'
        cat_name:
          type: string
          maxLength: 255

    MovementType:
      type: string
      enum: [EXPENSE, INCOME, TRANSFERT]
      description: TRANSFERT movements are only created through POST /api/transfer and rejected on direct creation.

    AccountInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    AccountPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    Account:
      type: object
      required: [id, id_user, name]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        created_at:
          type: [string, 'null']
          format: date-time

    TransferInput:
      type: object
      required: [id_account_source, id_account, amount]
      properties:
        id_account_source:
          type: string
          format: uuid
          description: Source account the money leaves. Stored in `id_account_source`.
        id_account:
          type: string
          format: uuid
          description: Destination account the money goes to. Stored in `id_account`.
        amount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Positive decimal amount with up to 10 total digits and 2 fractional digits.
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MovementInput:
      type: object
      required: [title, amount]
      properties:
        id_category:
          type: [string, 'null']
          format: uuid
        movement_type:
          $ref: '#/components/schemas/MovementType'
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        amount:
          type: string
          pattern: '^-?\d{1,8}(\.\d{1,2})?$'
          description: Decimal amount with up to 10 total digits and 2 fractional digits.
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MovementPatch:
      type: object
      minProperties: 1
      properties:
        id_category:
          type: [string, 'null']
          format: uuid
        movement_type:
          $ref: '#/components/schemas/MovementType'
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        amount:
          type: string
          pattern: '^-?\d{1,8}(\.\d{1,2})?$'
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MoneyMovement:
      type: object
      required: [id, id_user, movement_type, title, amount]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
        id_category:
          type: [string, 'null']
          format: uuid
        movement_type:
          $ref: '#/components/schemas/MovementType'
        title:
          type: string
          maxLength: 255
        description:
          type: [string, 'null']
        amount:
          type: string
          pattern: '^-?\d{1,8}(\.\d{1,2})?$'
        logged_for:
          type: [string, 'null']
          format: date
        logged_at:
          type: [string, 'null']
          format: date-time

    MovementPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MoneyMovement'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Balance:
      type: object
      required: [income, expense, balance, accounts]
      properties:
        income:
          type: string
          description: Lifetime income total with two fractional digits, excluding transfers.
        expense:
          type: string
          description: Lifetime expense total with two fractional digits, excluding transfers.
        balance:
          type: string
          description: Global lifetime income minus lifetime expenses with two fractional digits. Transfers have no effect on it.
        accounts:
          type: array
          description: Per-account balances for every account owned by the current user, including accounts without movements (reported as zeroed totals).
          items:
            $ref: '#/components/schemas/AccountBalance'

    AccountBalance:
      type: object
      required: [id_account, name, income, expense, balance]
      properties:
        id_account:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        income:
          type: string
          description: Income logged on the account with two fractional digits.
        expense:
          type: string
          description: Expenses logged on the account with two fractional digits.
        balance:
          type: string
          description: Account balance with two fractional digits. Transfers count toward it — money entering (destination) is positive, money leaving (source) is negative.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource does not exist or is not owned by the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
